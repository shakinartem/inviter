name: Refresh frontend lockfile

on:
  push:
    branches:
      - agent/production-deployment
    paths:
      - frontend/package.json

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-deployment
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh package lock from package.json
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify runtime audit after refresh
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Commit lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "Refresh frontend dependency lockfile"
          git push origin HEAD:agent/production-deployment
