name: Production stack validation

on:
  push:
    branches:
      - "agent/**"
  pull_request:

jobs:
  production-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare production test env
        run: cp .env.production.example .env.production

      - name: Validate shell scripts
        run: bash -n deploy/backup.sh deploy/restore.sh deploy/smoke-test.sh

      - name: Validate Compose configuration
        run: docker compose --env-file .env.production -f docker-compose.prod.yml config -q

      - name: Validate Caddy configuration
        run: docker run --rm -e APP_DOMAIN=inviter.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Build production images
        run: docker compose --env-file .env.production -f docker-compose.prod.yml build backend frontend

      - name: Start production core without public TLS edge
        run: docker compose --env-file .env.production -f docker-compose.prod.yml up -d postgres redis migrate backend frontend

      - name: Verify migration service succeeded
        run: |
          migrate_id="$(docker compose --env-file .env.production -f docker-compose.prod.yml ps -aq migrate)"
          test -n "$migrate_id"
          test "$(docker inspect -f '{{.State.Status}}' "$migrate_id")" = "exited"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$migrate_id")" = "0"

      - name: Verify backend health
        run: docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read().decode())"

      - name: Verify production registration and docs are closed
        run: |
          docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend python - <<'PY'
          import urllib.error
          import urllib.request
          for url in (
              'http://127.0.0.1:8000/docs',
              'http://127.0.0.1:8000/api/v1/auth/register',
          ):
              req = urllib.request.Request(url, method='GET')
              try:
                  urllib.request.urlopen(req, timeout=5)
              except urllib.error.HTTPError as exc:
                  assert exc.code == 404, (url, exc.code)
              else:
                  raise AssertionError(f'{url} unexpectedly reachable')
          PY

      - name: Bootstrap admin and verify login
        run: |
          docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend \
            python -m app.cli.create_admin --email ci-admin@example.com --password 'ci-admin-password-12345'
          docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          body = urllib.parse.urlencode({
              'username': 'ci-admin@example.com',
              'password': 'ci-admin-password-12345',
          }).encode()
          req = urllib.request.Request(
              'http://127.0.0.1:8000/api/v1/auth/jwt/login',
              data=body,
              headers={'Content-Type': 'application/x-www-form-urlencoded'},
              method='POST',
          )
          payload = json.loads(urllib.request.urlopen(req, timeout=5).read())
          assert payload.get('access_token')
          PY

      - name: Verify static frontend health
        run: docker compose --env-file .env.production -f docker-compose.prod.yml exec -T frontend wget -q -O - http://127.0.0.1/healthz

      - name: Verify Postgres and Redis are not published
        run: |
          test -z "$(docker compose --env-file .env.production -f docker-compose.prod.yml port postgres 5432 2>/dev/null || true)"
          test -z "$(docker compose --env-file .env.production -f docker-compose.prod.yml port redis 6379 2>/dev/null || true)"

      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file .env.production -f docker-compose.prod.yml logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose --env-file .env.production -f docker-compose.prod.yml down -v --remove-orphans
