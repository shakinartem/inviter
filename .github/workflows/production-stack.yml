name: Production stack validation

on:
  push:
    branches:
      - "agent/**"
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  production-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare valid CI-only production env
        run: |
          cp .env.production.example .env.production
          sed -i 's/^APP_DOMAIN=.*/APP_DOMAIN=inviter-ci.invalid/' .env.production
          sed -i 's/^APP_SECRET=.*/APP_SECRET=ci_app_secret_0123456789abcdef0123456789abcdef0123456789abcdef/' .env.production
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_postgres_0123456789abcdef0123456789/' .env.production
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=ci_redis_abcdef0123456789abcdef012345/' .env.production
          chmod 600 .env.production
          bash deploy/validate-env.sh

      - name: Verify and audit production frontend dependencies
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json
          npm audit --omit=dev --audit-level=high

      - name: Validate shell scripts
        run: bash -n deploy/validate-env.sh deploy/server-check.sh deploy/deploy.sh deploy/backup.sh deploy/restore.sh deploy/smoke-test.sh

      - name: Validate Compose configuration
        run: docker compose --env-file .env.production -f docker-compose.prod.yml config -q

      - name: Validate Caddy configuration
        run: docker run --rm -e APP_DOMAIN=inviter-ci.invalid -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Build production images
        run: IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml build backend frontend

      - name: Start production core without public TLS edge
        run: IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml up -d postgres redis migrate backend frontend celery_worker celery_beat

      - name: Verify migration service succeeded
        run: |
          migrate_id="$(IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml ps -aq migrate)"
          test -n "$migrate_id"
          for _ in $(seq 1 60); do
            state="$(docker inspect -f '{{.State.Status}}' "$migrate_id")"
            if [[ "$state" == "exited" ]]; then
              test "$(docker inspect -f '{{.State.ExitCode}}' "$migrate_id")" = "0"
              exit 0
            fi
            sleep 1
          done
          docker logs "$migrate_id" || true
          exit 1

      - name: Wait for backend readiness
        run: |
          backend_id="$(IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml ps -q backend)"
          test -n "$backend_id"
          for attempt in $(seq 1 60); do
            running="$(docker inspect -f '{{.State.Running}}' "$backend_id")"
            if [[ "$running" != "true" ]]; then
              docker logs "$backend_id" || true
              exit 1
            fi
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$backend_id")"
            echo "backend health attempt $attempt: $health"
            [[ "$health" == "healthy" ]] && exit 0
            [[ "$health" == "unhealthy" ]] && { docker logs "$backend_id" || true; exit 1; }
            sleep 2
          done
          docker logs "$backend_id" || true
          exit 1

      - name: Verify deep backend readiness
        run: IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend python -c "import json, urllib.request; p=json.loads(urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()); assert p['checks']=={'postgres':'ok','redis':'ok'}, p; print(p)"

      - name: Verify worker readiness
        run: |
          worker_id="$(IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml ps -q celery_worker)"
          test -n "$worker_id"
          for attempt in $(seq 1 45); do
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$worker_id")"
            echo "worker health attempt $attempt: $health"
            [[ "$health" == "healthy" ]] && exit 0
            [[ "$health" == "unhealthy" ]] && { docker logs "$worker_id" || true; exit 1; }
            sleep 2
          done
          docker logs "$worker_id" || true
          exit 1

      - name: Verify production registration and docs are closed
        run: |
          IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend python - <<'PY'
          import urllib.error
          import urllib.request
          for url in (
              'http://127.0.0.1:8000/docs',
              'http://127.0.0.1:8000/openapi.json',
              'http://127.0.0.1:8000/api/v1/auth/register',
          ):
              req = urllib.request.Request(url, method='GET')
              try:
                  urllib.request.urlopen(req, timeout=5)
              except urllib.error.HTTPError as exc:
                  assert exc.code == 404, (url, exc.code)
              else:
                  raise AssertionError(f'{url} unexpectedly reachable')
          PY

      - name: Bootstrap production admin with CLI
        run: |
          IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend \
            python -m app.cli.create_admin --email ci-admin@example.invalid --password 'ci-admin-password-12345'

      - name: Verify bootstrapped admin state in PostgreSQL
        run: |
          IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend python - <<'PY'
          import asyncio
          from sqlalchemy import select
          from app.db import models as _models  # noqa: F401 - register all ORM relationship targets
          from app.db.session import AsyncSessionLocal
          from app.features.auth.models import User

          async def main():
              async with AsyncSessionLocal() as session:
                  user = (await session.execute(select(User).where(User.email == 'ci-admin@example.invalid'))).scalar_one()
                  assert user.is_active is True
                  assert user.is_superuser is True
                  assert user.is_verified is True
                  assert user.hashed_password
                  assert user.hashed_password != 'ci-admin-password-12345'
                  print({'id': str(user.id), 'active': user.is_active, 'superuser': user.is_superuser, 'verified': user.is_verified})
          asyncio.run(main())
          PY

      - name: Verify production JWT login
        run: |
          IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          body = urllib.parse.urlencode({
              'username': 'ci-admin@example.invalid',
              'password': 'ci-admin-password-12345',
          }).encode()
          req = urllib.request.Request(
              'http://127.0.0.1:8000/api/v1/auth/jwt/login',
              data=body,
              headers={'Content-Type': 'application/x-www-form-urlencoded'},
              method='POST',
          )
          try:
              response = urllib.request.urlopen(req, timeout=5)
              payload = json.loads(response.read())
          except urllib.error.HTTPError as exc:
              print('JWT login failed:', exc.code, exc.read().decode(errors='replace'))
              raise
          assert payload.get('access_token'), payload
          assert payload.get('token_type') == 'bearer', payload
          print({'token_type': payload['token_type'], 'access_token_present': True})
          PY

      - name: Verify Telegram session volume and backup snapshot
        run: |
          printf 'ci\n' > .deploy-current
          IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend sh -c "printf session-persistence-ok > /data/sessions/ci-sentinel"
          IMAGE_TAG=ci bash deploy/backup.sh
          latest="$(ls -1dt backups/* | head -n 1)"
          test -f "$latest/postgres.dump"
          test -f "$latest/SHA256SUMS"
          test -f "$latest/METADATA"
          (cd "$latest" && sha256sum -c SHA256SUMS)
          tar tzf "$latest/telegram-sessions.tar.gz" | grep -q 'ci-sentinel'
          IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend test -f /data/sessions/ci-sentinel
          printf '%s\n' "$latest" > /tmp/qualive-latest-backup

      - name: Drill PostgreSQL restore into an isolated database
        run: |
          latest="$(cat /tmp/qualive-latest-backup)"
          IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres dropdb -U inviter --if-exists ci_restore_verify
          IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres createdb -U inviter ci_restore_verify
          cat "$latest/postgres.dump" | IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres \
            pg_restore -U inviter -d ci_restore_verify --no-owner --no-privileges --exit-on-error
          version="$(IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres \
            psql -U inviter -d ci_restore_verify -Atc 'select version_num from alembic_version')"
          test -n "$version"
          IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres dropdb -U inviter ci_restore_verify

      - name: Verify static frontend health
        run: IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml exec -T frontend wget -q -O - http://127.0.0.1/healthz

      - name: Verify internal services are not published
        run: |
          IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml ps -q postgres redis backend | while read -r container_id; do
            test -n "$container_id"
            docker inspect -f '{{json .NetworkSettings.Ports}}' "$container_id"
            if docker inspect -f '{{range $port, $bindings := .NetworkSettings.Ports}}{{if $bindings}}{{range $bindings}}{{if .HostPort}}{{println $port .HostIp .HostPort}}{{end}}{{end}}{{end}}{{end}}' "$container_id" | grep -q .; then
              echo "Internal service unexpectedly has a published host port: $container_id" >&2
              docker inspect -f '{{json .NetworkSettings.Ports}}' "$container_id" >&2
              exit 1
            fi
          done

      - name: Package validated source from tracked files only
        run: git archive --format=zip --prefix=qualive-inviter/ -o qualive-inviter-production-ready.zip HEAD

      - name: Upload validated source archive
        uses: actions/upload-artifact@v4
        with:
          name: qualive-inviter-production-ready
          path: qualive-inviter-production-ready.zip
          if-no-files-found: error
          retention-days: 14

      - name: Show logs on failure
        if: failure()
        run: IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml logs --no-color

      - name: Cleanup
        if: always()
        run: IMAGE_TAG=ci docker compose --env-file .env.production -f docker-compose.prod.yml down -v --remove-orphans
