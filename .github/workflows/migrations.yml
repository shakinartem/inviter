name: Migration validation

on:
  pull_request:
  push:
    branches:
      - agent/**
      - release/**
      - main

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inviter
          POSTGRES_USER: inviter
          POSTGRES_PASSWORD: inviter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inviter -d inviter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      APP_SECRET: ci-only-strong-secret-change-before-production-2026
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: inviter
      POSTGRES_USER: inviter
      POSTGRES_PASSWORD: inviter
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic current
